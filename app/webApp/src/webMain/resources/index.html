<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helping Hand</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link type="text/css" rel="stylesheet" href="styles.css">
    <style>
        /* Loading screen shown until the app has started (replaced by the app when ready) */
        :root { --bg: #F4F7FE; --fg: #02215E; --muted: #4A5B82; --accent: #103F9B; --track: #D5DEF0; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #01163F; --fg: #F4F7FE; --muted: #C3CEEA; --accent: #8EAEFF; --track: #2A3F73; }
        }
        body { background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        #loading { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
        #loading img { width: 112px; height: 112px; }
        #loading h1 { margin: 0; font-size: 28px; font-weight: 600; }
        #loading p { margin: 0; font-size: 18px; color: var(--muted); }
        .spinner { width: 36px; height: 36px; border-radius: 50%; border: 4px solid var(--track);
                   border-top-color: var(--accent); animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading" role="status" aria-live="polite">
        <img src="loading-logo.png" alt="">
        <h1>Helping Hand</h1>
        <div class="spinner"></div>
        <p>Loading…</p>
    </div>
    <script>
        // Remove the loading screen as soon as the app has created its canvas.
        new MutationObserver(function (_, observer) {
            if (document.querySelector("canvas")) {
                observer.disconnect();
                setTimeout(function () {
                    var el = document.getElementById("loading");
                    if (el) el.remove();
                }, 150);
            }
        }).observe(document.body, { childList: true, subtree: true });
    </script>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
